{% extends "base.html" %}
{% block page_title %}Application Error{% endblock %}
{% block content %}
<section class="panel" style="text-align: center; padding: 60px 24px;">
  <div style="font-family: 'Space Grotesk', sans-serif; font-size: 72px; font-weight: 700; color: var(--critical); line-height: 1;">500</div>
  <h2 style="margin-top: 12px; color: var(--text-strong);">Something went wrong</h2>
  <p style="color: var(--muted); max-width: 480px; margin: 8px auto 22px;">
    SAFEGUARD hit an unexpected error. Return to the dashboard and retry the workflow.
  </p>
  <a class="btn btn-primary" href="{{ url_for('dashboard') }}"><i class="bi bi-arrow-left"></i> Return to dashboard</a>
</section>
{% endblock %}
