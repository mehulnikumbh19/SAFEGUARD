# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect repo: https://github.com/mehulnikumbh19/SAFEGUARD
services:
  - type: web
    name: safeguard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: FLASK_DEBUG
        value: "0"
